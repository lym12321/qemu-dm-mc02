name: Native packages

on:
  workflow_dispatch:
  push:
    branches: [main, refactor/composable-platform]
    paths:
      - '.github/workflows/native-packages.yml'
      - 'qemu/upstream'
      - 'qemu.lock'
      - 'cosim/**'
      - 'tools/build-qemu.sh'
      - 'tools/qemu-build-env.sh'
      - 'tools/package-qemu.py'
      - 'tools/check-qemu-package.py'
      - 'tools/linux_runtime.py'
      - 'tools/check-linux-runtime.py'
      - 'tools/build-linux-runtime.sh'
      - 'tools/build-linux-sdk.sh'
      - 'sim/physics/gazebo_native/**'
      - 'third_party/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the existing bare-metal example
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi cmake
          cmake -S examples/minimal-board -B build/guest -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/guest
      - uses: actions/upload-artifact@v4
        with:
          name: package-test-firmware
          path: build/guest/firmware.elf
          if-no-files-found: error

  linux:
    needs: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DM_MUJOCO_PREFIX: ${{ github.workspace }}/build/mujoco-3.12.0
    steps:
      - name: Install standard Ubuntu build tools
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libglib2.0-dev zlib1g-dev python3 \
            python3-venv python3-pip ninja-build git ca-certificates curl \
            cmake patchelf strace gnupg lsb-release libprotobuf-dev protobuf-compiler \
            libzmq3-dev libzip-dev libsqlite3-dev libtinyxml2-dev
      - name: Install standard native ROS2 Jazzy and Gazebo SDK packages
        run: |
          sudo curl --fail --location https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            --output /usr/share/keyrings/ros-archive-keyring.gpg
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu noble main' \
            | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ros-jazzy-ros-base ros-jazzy-ros-gz-bridge ros-jazzy-gz-sim-vendor \
            ros-jazzy-gz-rendering-vendor ros-jazzy-gz-sensors-vendor \
            libegl1-mesa-dev libgl1-mesa-dri
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.91.1'
          components: clippy,rustfmt
      - uses: actions/download-artifact@v4
        with:
          name: package-test-firmware
          path: build/guest
      - name: Build the pinned QEMU with system tools
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/qemu/upstream"
          bash tools/build-qemu.sh
      - name: Build the pinned Python-free native SDK
        run: bash tools/build-linux-sdk.sh
      - name: Package the small Linux firmware product
        run: |
          cargo build --release --locked -p sim-host
          python3 tools/package-qemu.py --qemu build/qemu/qemu-system-arm \
            --sim target/release/sim --output dist/dm-mc02-linux-firmware-x86_64
          cp build/guest/firmware.elf dist/dm-mc02-linux-firmware-x86_64/example.elf
          python3 tools/check-qemu-package.py \
            --sim dist/dm-mc02-linux-firmware-x86_64/sim \
            --qemu dist/dm-mc02-linux-firmware-x86_64/bin/qemu-system-arm \
            --firmware dist/dm-mc02-linux-firmware-x86_64/example.elf \
            --report dist/dm-mc02-linux-firmware-x86_64/smoke.json
          tar -C dist -czf dist/dm-mc02-linux-firmware-x86_64.tar.gz dm-mc02-linux-firmware-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: dm-mc02-linux-firmware-x86_64
          path: dist/dm-mc02-linux-firmware-x86_64.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Build and package the complete Linux runtime
        run: |
          bash tools/build-linux-runtime.sh
          bash tools/build-linux-runtime.sh --example package_native_probe
          python3 tools/package-qemu.py --qemu build/qemu/qemu-system-arm \
            --sim target/release/sim --linux-full --mujoco-prefix "$DM_MUJOCO_PREFIX" \
            --output dist/dm-mc02-linux-x86_64
          cp build/guest/firmware.elf dist/dm-mc02-linux-x86_64/example.elf
      - name: Run the standalone executable without native SDKs or Python in PATH
        run: |
          ldd dist/dm-mc02-linux-x86_64/sim | tee dist/dm-mc02-linux-x86_64/runtime-libraries.txt
          ldd dist/dm-mc02-linux-x86_64/bin/qemu-system-arm | tee -a dist/dm-mc02-linux-x86_64/runtime-libraries.txt
          ! grep -E '/nix/|not found|libpython' dist/dm-mc02-linux-x86_64/runtime-libraries.txt
          # The consumer has only the declared host ABI/graphics drivers. Its
          # Python, patchelf and strace are test tools, absent from the app PATH.
          docker run --rm -v "$GITHUB_WORKSPACE:/checkout:ro" \
            -v "$GITHUB_WORKSPACE/dist:/dist" -w /tmp ubuntu:24.04 bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                python3 patchelf strace libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri
              python3 /checkout/tools/check-linux-runtime.py \
                --package /dist/dm-mc02-linux-x86_64 \
                --native-probe /checkout/target/release/examples/package_native_probe \
                --report /dist/dm-mc02-linux-x86_64/native-smoke.json
              python3 /checkout/tools/check-qemu-package.py \
                --sim /dist/dm-mc02-linux-x86_64/sim \
                --qemu /dist/dm-mc02-linux-x86_64/bin/qemu-system-arm \
                --firmware /dist/dm-mc02-linux-x86_64/example.elf \
                --report /dist/dm-mc02-linux-x86_64/smoke.json
            '
          tar -C dist -czf dist/dm-mc02-linux-x86_64.tar.gz dm-mc02-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: dm-mc02-linux-x86_64
          path: dist/dm-mc02-linux-x86_64.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Record verification
        run: echo 'Ubuntu 24.04 x86_64 complete Rust runtime — recursive bundled native closure, actual MuJoCo/Ogre2/ROS context, firmware UART and reset-paused GDB listener passed without Python in PATH. Host glibc and EGL/GLVND graphics drivers remain system dependencies. QEMU and native libraries are stored once.' >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: firmware
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Use LF consistently in Git for Windows and MSYS2
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned native MSVC Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.91.1'
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make diffutils bison flex
            mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
            mingw-w64-x86_64-glib2 mingw-w64-x86_64-zlib
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip mingw-w64-x86_64-ninja
      - uses: actions/download-artifact@v4
        with:
          name: package-test-firmware
          path: build/guest
      - name: Build using upstream QEMU's MinGW support
        shell: msys2 {0}
        run: |
          git diff --exit-code --stat --ignore-submodules=all HEAD
          git -C qemu/upstream diff --exit-code --stat --ignore-submodules=all HEAD
          # QEMU 8.2's mkvenv generates a malformed file://D:/ wheel URL.
          # Install the same source-pinned wheel using pip's normal path input.
          python -m pip install --no-index --find-links qemu/upstream/python/wheels meson==1.2.3
          package_prefix=$(cygpath -m "$PWD/build/install")
          mkdir -p build/qemu
          cd build/qemu
          ../../qemu/upstream/configure --target-list=arm-softmmu --with-devices-arm=dm-mc02 \
            --prefix="$package_prefix" \
            --disable-docs --disable-werror --disable-capstone --disable-slirp \
            --disable-sdl --disable-gtk --disable-plugins --enable-fdt=internal \
            --enable-download -Dbuildtype=release -Dqom_cast_debug=false
          ninja qemu-system-arm.exe
      - name: Build the native Rust firmware entry
        shell: pwsh
        env:
          # Keep the launcher independent of a separate Visual C++ runtime.
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          cargo build --release --locked -p sim-host --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Rust entry and recursive MinGW QEMU DLL dependencies
        shell: msys2 {0}
        run: |
          export PATH="$(cygpath -u "$USERPROFILE")/.cargo/bin:$PATH"
          python tools/package-qemu.py --qemu build/qemu/qemu-system-arm.exe \
            --sim target/x86_64-pc-windows-msvc/release/sim.exe \
            --dll-dir "$(cygpath -m /mingw64/bin)" --output dist/dm-mc02-windows-x86_64
      - name: Include the actual firmware used by the package smoke
        shell: pwsh
        run: |
          Copy-Item build/guest/firmware.elf dist/dm-mc02-windows-x86_64/example.elf
      - name: Run on native Windows without MSYS2 in PATH
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $root = $env:GITHUB_WORKSPACE
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Set-Location $env:RUNNER_TEMP
          & $python "$root/tools/check-qemu-package.py" `
            --sim "$root/dist/dm-mc02-windows-x86_64/sim.exe" `
            --qemu "$root/dist/dm-mc02-windows-x86_64/bin/qemu-system-arm.exe" `
            --firmware "$root/dist/dm-mc02-windows-x86_64/example.elf" `
            --report "$root/dist/dm-mc02-windows-x86_64/smoke.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: dm-mc02-windows-x86_64
          path: dist/dm-mc02-windows-x86_64/
          if-no-files-found: error
          retention-days: 30
      - name: Record verification boundary
        shell: pwsh
        run: Add-Content $env:GITHUB_STEP_SUMMARY 'Windows x86_64 Rust firmware entry — real firmware UART, monitor exit and reset-paused GDB port passed without Python or MSYS2 in PATH. QEMU/DLLs are stored once beside the launcher. Full Simulation/Lab migration remains separate.'
