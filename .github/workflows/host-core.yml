name: Rust platform contracts

on:
  pull_request:
  push:
    branches: [main, refactor/composable-platform]
  workflow_dispatch:

jobs:
  host-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.91.1'
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent MCAP consumer (test tools only)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install mcap==1.5.0
      - name: Core and host boundaries
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: cargo test --locked --workspace --features sim-host/host-runtime
      - name: Rust diagnostics
        run: cargo clippy --locked --workspace --features sim-host/host-runtime --all-targets --no-deps -- -D warnings
      - name: Standalone CLI without checkout or Python runtime
        run: |
          cargo build --locked --release -p sim-host --features host-runtime
          python tests/cli_contract.py --sim target/release/sim
      - name: Record native coverage boundary
        if: always()
        run: echo 'Native MCU, MuJoCo, Gazebo and ROS integration — NOT RUN by this host-only job.' >> "$GITHUB_STEP_SUMMARY"
