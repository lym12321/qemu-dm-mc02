name: Core platform only

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install base package and test runner
        run: python -m pip install . 'pytest>=8,<9'
      - name: Core runtime, fabric and pure adapter contracts
        run: >-
          python -m pytest -q
          tests/test_topology.py tests/test_simulation.py
          tests/test_simulation_inputs.py tests/test_simulation_session.py tests/test_can_fabric.py
          tests/test_can_host.py tests/test_scene_admission.py
          tests/test_can_faults.py tests/test_can_fault_experiment.py tests/test_can_fault_smoke.py
          tests/test_can_bridge.py tests/test_can_endpoints.py tests/test_worker_transport.py
          tests/test_digital_fabric.py tests/test_uart_fabric.py
          tests/test_edge_fabric.py tests/test_joint_execution.py
          tests/test_qemu_machine.py tests/test_qemu_imu.py
          tests/test_qmp_distribution.py tests/test_scene_cli.py
          tests/test_simulation_digital.py tests/test_simulation_rotor.py
          tests/test_sim_experiment.py tests/test_lab_experiment.py
          tests/test_lab_manifest.py tests/test_automatic_lab_smoke.py
      - name: Installed CLI and missing native backend
        working-directory: /tmp
        env:
          PYTHONPATH: ''
          PYTHONHOME: ''
        run: |
          python -I - <<'PY'
          import contextlib
          import importlib.abc
          import importlib.metadata
          import io
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          optional = {'qemu', 'mujoco', 'numpy', 'mcap', 'crccheck', 'aiohttp', 'tools'}
          class PureImports(importlib.abc.MetaPathFinder):
              def find_spec(self, fullname, path=None, target=None):
                  if fullname.split('.')[0] in optional:
                      raise AssertionError('unexpected optional import: ' + fullname)
          sys.meta_path.insert(0, PureImports())
          import sim
          from sim.cli import main
          assert '/site-packages/' in str(Path(sim.__file__).resolve())
          installed = {dist.metadata['Name'].lower() for dist in importlib.metadata.distributions()}
          assert not (installed & (optional - {'tools'})), installed
          try:
              main(['--help'])
          except SystemExit as result:
              assert result.code == 0
          with tempfile.TemporaryDirectory(prefix='sim.core-ci.') as name:
              directory = Path(name)
              pure_scene = directory / 'uart.yaml'
              pure_scene.write_text('schema: sim/v1\nruntime:\n  duration: 2ms\nnodes:\n'
                                    '  left:\n    kind: device.uart-echo\n'
                                    '  right:\n    kind: device.uart-echo\n'
                                    '  wire:\n    kind: net.uart\nlinks:\n'
                                    '  - [left.uart, wire.uart]\n  - [right.uart, wire.uart]\n')
              assert main(['validate', str(pure_scene)]) == 0
              pure_report = directory / 'uart-report.json'
              assert main(['run', str(pure_scene), '--report', str(pure_report)]) == 0
              assert json.loads(pure_report.read_text()) == {
                  'status': 'passed', 'result': {'time_ns': 2_000_000}}
              experiment = directory / 'experiment.yaml'
              experiment.write_text('schema: sim/v1\nruntime: {duration: 4ms}\nnodes:\n'
                                    '  host: {kind: device.can-host}\n'
                                    '  peer: {kind: device.can-host}\n'
                                    '  bus:\n    kind: bus.can\n    fault_profiles:\n'
                                    '      loss:\n        drop:\n'
                                    '          - {source: host.can, destination: peer.can, can_id: 292}\nlinks:\n'
                                    '  - [host.can, bus.can]\n  - [peer.can, bus.can]\n'
                                    'experiment:\n  inputs:\n'
                                    '    - {at: 0ms, endpoint: bus.fault, value: loss}\n'
                                    '    - {at: 1ms, endpoint: host.tx, value: {id: 292, dlc: 1, data_hex: "99"}}\n'
                                    '    - {at: 2ms, endpoint: bus.fault, value: normal}\n'
                                    '    - {at: 3ms, endpoint: host.tx, value: {id: 291, dlc: 1, data_hex: "42"}}\n'
                                    '  assertions:\n    - before: 4ms\n'
                                    '      can_seen: {endpoint: host.can, id: 291, data_hex: "42"}\n')
              experiment_report = directory / 'experiment-report.json'
              assert main(['validate', str(experiment)]) == 0
              captured = io.StringIO()
              with contextlib.redirect_stdout(captured):
                  assert main(['run', str(experiment), '--report', str(experiment_report)]) == 0
              observed = json.loads(experiment_report.read_text())
              assert observed['status'] == 'passed' and observed['result']['status'] == ['pass']
              assert observed['result']['delivered_inputs'] == 4
              events = [json.loads(line) for line in captured.getvalue().splitlines() if line.startswith('{')]
              assert [(event['payload']['frame']['can_id'], event['payload']['dropped'],
                       event['payload']['destination'], event['delivery_time_ns'])
                      for event in events if event['kind'] == 'can.delivery'] == [
                          (292, True, 'peer.can', 1_000_000), (291, False, 'peer.can', 3_000_000)]
              assert [event['payload']['profile'] for event in events
                      if event['kind'] == 'can.fault.applied'] == ['loss', 'normal']
              (directory / 'firmware.elf').write_bytes(b'admission fixture; never executed')
              scene = directory / 'scene.yaml'
              scene.write_text('schema: sim/v1\nnodes:\n  main:\n'
                               '    kind: machine.qemu\n    firmware: firmware.elf\nlinks: []\n')
              report = directory / 'report.json'
              result = subprocess.run([str(Path(sys.executable).with_name('sim')), 'run', str(scene),
                                       '--qemu', str(directory / 'missing-qemu'), '--report', str(report)],
                                      cwd='/tmp', capture_output=True, text=True, timeout=10)
              assert result.returncode == 78, (result.returncode, result.stderr)
              payload = json.loads(report.read_text())
              assert payload['status'] == 'blocked' and payload['error_type'] == 'BackendUnavailable', payload
              assert 'QEMU' in payload['error'] and 'missing-qemu' in payload['error'], payload
          PY

  shared-world-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host contract dependencies
        run: python -m pip install '.[referee]' 'pytest>=8,<9'
      - name: SharedWorld cuts, wire admission and cleanup without native backends
        run: python -m pytest -q tests/test_sim_shared_world.py

  experiment-recording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install trace extra without native backends
        run: python -m pip install '.[trace]' 'pytest>=8,<9'
      - name: MCAP, finite experiment and offline replay contracts
        run: >-
          python -m pytest -q
          tests/test_sim_trace.py tests/test_sim_experiment.py
          tests/test_experiment_trace.py tests/test_experiment_replay.py
          tests/test_experiment_trace_cli.py
      - name: Installed recording and standalone replay
        working-directory: /tmp
        env:
          PYTHONPATH: ''
          PYTHONHOME: ''
        run: |
          python -I - <<'PY'
          import importlib.abc
          import importlib.util
          import json
          from pathlib import Path
          import sys
          import tempfile

          class NoNative(importlib.abc.MetaPathFinder):
              def find_spec(self, fullname, path=None, target=None):
                  if fullname.split('.')[0] in {'qemu', 'mujoco', 'numpy', 'tools'}:
                      raise AssertionError('unexpected native import: ' + fullname)
          sys.meta_path.insert(0, NoNative())
          from sim.cli import main
          import sim
          assert '/site-packages/' in str(Path(sim.__file__).resolve())
          with tempfile.TemporaryDirectory(prefix='sim.trace-ci.') as name:
              directory = Path(name)
              scene = directory / 'scene.yaml'
              scene.write_text('schema: sim/v1\nruntime: {duration: 3ms}\nnodes:\n'
                               '  host: {kind: device.can-host}\n'
                               '  peer: {kind: device.can-host}\n'
                               '  bus: {kind: bus.can}\nlinks:\n'
                               '  - [host.can, bus.can]\n  - [peer.can, bus.can]\n'
                               'experiment:\n  inputs:\n'
                               '    - {at: 1ms, endpoint: host.tx, value: {id: 291, dlc: 1, data_hex: "42"}}\n'
                               '  assertions:\n    - before: 3ms\n'
                               '      can_seen: {endpoint: host.can, id: 291, data_hex: "42"}\n')
              trace, live, offline = (directory / name for name in ('observations.mcap', 'live.json', 'offline.json'))
              assert main(['run', str(scene), '--trace', str(trace), '--report', str(live)]) == 0
              scene.unlink()
              assert main(['replay', str(trace), '--report', str(offline)]) == 0
              online = json.loads(live.read_text())
              replayed = json.loads(offline.read_text())
              assert online['status'] == replayed['status'] == 'passed'
              assert online['result'] == replayed['result']
          PY
