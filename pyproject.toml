[project]
name = "dm-mc02-build-tests"
version = "0.1.0"
description = "Build tools and independent black-box tests for the Rust runtime"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "PyYAML==6.0.3",
    "mcap==1.5.0",
    "crccheck==1.3.1",
    "qemu==0.6.1.0a1",
]
web-test = [
    "aiohttp==3.14.3",
    "playwright==1.56.0",
]
native-test = [
    "mujoco==3.12.0",
]

[tool.uv.sources]
qemu = { path = "qemu/upstream/python" }

[tool.pytest.ini_options]
testpaths = ["tests"]
