[project]
name = "dm-mc02-qemu-tools"
version = "0.1.0"
description = "Deterministic tooling for the independent DM-MC02 QEMU backend"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mujoco = [
    "mujoco>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
