schema: sim/v1
runtime: {mode: stepped, quantum: 10ms, duration: 80ms}
nodes:
  main:
    kind: machine.qemu
    model: dm-mc02
    firmware: ./build/firmware.elf
    adc: true
  world:
    kind: physics.mujoco
    model: ../shared-world/imu.xml
    imus:
      body: [body gyro, body accel]
  wire: {kind: net.imu}
links:
  - [world.imu.body, wire.signal]
  - [wire.signal, main.imu]
experiment:
  ready: [{name: main, endpoint: main.uart1, text: ADC_IMU_READY}]
  inputs:
    - {at: 20ms, endpoint: main.adc1.ch4, value: {raw: 12345}}
    - {at: 40ms, endpoint: main.adc1.ch4, value: {voltage_uv: 1650000}}
  assertions:
    - {before: 40ms, uart_contains: {endpoint: main.uart1, text: 'ADC_IMU_READ n=1 adc=3039'}}
    - {before: 60ms, uart_contains: {endpoint: main.uart1, text: 'ADC_IMU_READ n=2 adc=8000'}}
