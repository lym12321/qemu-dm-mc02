schema: sim/v1
runtime: {duration: 800ms, quantum: 1ms}
nodes:
  main:
    kind: machine.qemu
    model: dm-mc02
    firmware: ../../build/teaching/Debug/gpio_key.elf
    uarts: []
experiment:
  inputs:
    - {at: 100ms, endpoint: main.key, value: true}
    - {at: 600ms, endpoint: main.key, value: false}
  assertions:
    - {before: 500ms, digital_equals: {endpoint: main.gpio.B0, value: 1}}
