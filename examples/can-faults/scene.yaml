    - {at: 70ms, endpoint: diagnostic.tx, value: {id: 0x322, dlc: 8, data_hex: '5316d4c090808e65'}}
    - {at: 75ms, endpoint: heartbeat.tx, value: {id: 0x321, dlc: 8, data_hex: 'c032a31303a4f9b6'}}
