# Fixed host-origin heartbeat/challenge fixture; no motor/physical policy.
schema: sim/v1
runtime: {mode: stepped, quantum: 1ms, duration: 120ms}
nodes:
  main:
    kind: machine.qemu
    model: dm-mc02
    firmware: ./build/Debug/firmware.elf
  can0:
    kind: bus.can
    fault_profiles:
      missing-heartbeat:
        drop: [{source: heartbeat.can, destination: main.fdcan1, can_id: 0x321}]
      delayed: {delay_ns: 7000000}
  heartbeat: {kind: device.can-host}
  diagnostic: {kind: device.can-host}
  observer: {kind: device.can-host}
links:
  - [main.fdcan1, can0.can]
  - [heartbeat.can, can0.can]
  - [diagnostic.can, can0.can]
  - [observer.can, can0.can]
experiment:
  ready: [{name: main, endpoint: main.uart1, text: "SIM_READY can-faults\n"}]
  inputs:
    - {at: 0ms, endpoint: can0.fault, value: normal}
    - {at: 5ms, endpoint: heartbeat.tx, value: {id: 0x321, dlc: 8, data_hex: 'eea55c132d3306b6'}}
    - {at: 5ms, endpoint: diagnostic.tx, value: {id: 0x322, dlc: 8, data_hex: '12d510c0d1434a65'}}
    - {at: 10ms, endpoint: heartbeat.tx, value: {id: 0x321, dlc: 8, data_hex: 'fdaf61133e393bb6'}}
    - {at: 10ms, endpoint: diagnostic.tx, value: {id: 0x322, dlc: 8, data_hex: '17da1fc0d44c4565'}}
    - {at: 15ms, endpoint: heartbeat.tx, value: {id: 0x321, dlc: 8, data_hex: '0cba6613cf2c3cb6'}}
    - {at: 15ms, endpoint: diagnostic.tx, value: {id: 0x322, dlc: 8, data_hex: '1cdf2ec0df497465'}}
    - {at: 20ms, endpoint: can0.fault, value: missing-heartbeat}
    - {at: 20ms, endpoint: heartbeat.tx, value: {id: 0x321, dlc: 8, data_hex: '1bc46b13d85231b6'}}
    - {at: 20ms, endpoint: diagnostic.tx, value: {id: 0x322, dlc: 8, data_hex: '21e43dc0e2726765'}}
    - {at: 25ms, endpoint: heartbeat.tx, value: {id: 0x321, dlc: 8, data_hex: '2ace7013e9582ab6'}}
    - {at: 25ms, endpoint: diagnostic.tx, value: {id: 0x322, dlc: 8, data_hex: '26e94cc0e57f1665'}}
    - {at: 30ms, endpoint: heartbeat.tx, value: {id: 0x321, dlc: 8, data_hex: '39d87513fa4e2fb6'}}
    - {at: 30ms, endpoint: diagnostic.tx, value: {id: 0x322, dlc: 8, data_hex: '2bee5bc0e8780165'}}
    - {at: 35ms, endpoint: heartbeat.tx, value: {id: 0x321, dlc: 8, data_hex: '48e27a138b7420b6'}}
    - {at: 35ms, endpoint: diagnostic.tx, value: {id: 0x322, dlc: 8, data_hex: '30f36ac0f3653065'}}
    - {at: 40ms, endpoint: heartbeat.tx, value: {id: 0x321, dlc: 8, data_hex: '57ec7f13947a25b6'}}
    - {at: 40ms, endpoint: diagnostic.tx, value: {id: 0x322, dlc: 8, data_hex: '35f879c0f66e2365'}}
    - {at: 45ms, endpoint: heartbeat.tx, value: {id: 0x321, dlc: 8, data_hex: '66f68413a560deb6'}}
    - {at: 45ms, endpoint: diagnostic.tx, value: {id: 0x322, dlc: 8, data_hex: '3afd88c0f96bd265'}}
