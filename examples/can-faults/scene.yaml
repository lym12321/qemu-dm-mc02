    - {at: 85ms, endpoint: diagnostic.tx, value: {id: 0x322, dlc: 8, data_hex: '622501c1a1b35b64'}}
    - {at: 90ms, endpoint: heartbeat.tx, value: {id: 0x321, dlc: 8, data_hex: 'ed50b2132ec6e8b6'}}
    - {at: 90ms, endpoint: diagnostic.tx, value: {id: 0x322, dlc: 8, data_hex: '672a10c1a4bc4a64'}}
    - {at: 95ms, endpoint: heartbeat.tx, value: {id: 0x321, dlc: 8, data_hex: 'fc5ab7133fccedb6'}}
    - {at: 95ms, endpoint: diagnostic.tx, value: {id: 0x322, dlc: 8, data_hex: '6c2f1fc1afb94564'}}
    - {at: 100ms, endpoint: heartbeat.tx, value: {id: 0x321, dlc: 8, data_hex: '0b65bc13c8f3e6b6'}}
    - {at: 100ms, endpoint: diagnostic.tx, value: {id: 0x322, dlc: 8, data_hex: '71342ec1b2a27464'}}
    - {at: 105ms, endpoint: heartbeat.tx, value: {id: 0x321, dlc: 8, data_hex: '1a6fc113d9f99bb6'}}
    - {at: 105ms, endpoint: diagnostic.tx, value: {id: 0x322, dlc: 8, data_hex: '76393dc1b5af6764'}}
  assertions:
    - {before: 20ms, uart_contains: {endpoint: main.uart1, text: 'HB_ACTIVE'}}
    - {before: 45ms, uart_contains: {endpoint: main.uart1, text: 'HB_TIMEOUT'}}
    - {before: 65ms, uart_contains: {endpoint: main.uart1, text: 'HB_RECOVERED'}}
    - {before: 120ms, uart_contains: {endpoint: main.uart1, text: 'CAN_FAULT_PASS'}}
    - {before: 45ms, digital_equals: {endpoint: main.gpio.B0, value: 1}}
