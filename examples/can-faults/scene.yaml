    - {at: 50ms, endpoint: heartbeat.tx, value: {id: 0x321, dlc: 8, data_hex: '75008a13b696d0b6'}}
    - {at: 50ms, endpoint: diagnostic.tx, value: {id: 0x322, dlc: 8, data_hex: '3f0298c0fc94c265'}}
    - {at: 55ms, endpoint: heartbeat.tx, value: {id: 0x321, dlc: 8, data_hex: '840a8f13479cd5b6'}}
